name: RAG backend tests
on:
  push:
    paths: ['Backend/rag/**', 'CrashSafe/Services/Assistant/AssistantService.swift', '.github/workflows/rag.yml']
  pull_request:
    paths: ['Backend/rag/**', 'CrashSafe/Services/Assistant/AssistantService.swift', '.github/workflows/rag.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional adapter test dependency
        run: python -m pip install -r requirements-integration.txt
      - name: Build medical index
        run: python rag.py ingest
      - name: Check generated offline knowledge
        run: python sync_knowledge.py --check
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
