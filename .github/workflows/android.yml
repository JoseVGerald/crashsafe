name: Android build and test
on:
  push:
    branches: [master, main, 'codex/**', 'feature/android-app']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install target SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK and run unit tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain
      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/outputs/roborazzi/
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CrashSafe-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
