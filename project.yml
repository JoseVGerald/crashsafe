name: CrashSafe
options:
  bundleIdPrefix: org.cac
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: ""   # set your team ID here (or in Xcode) for device builds

# To enable Firebase auth, uncomment this block and the dependencies below,
# then run `xcodegen`. See README.md.
# packages:
#   Firebase:
#     url: https://github.com/firebase/firebase-ios-sdk
#     from: 11.0.0

targets:
  CrashSafe:
    type: application
    platform: iOS
    sources:
      - path: CrashSafe
    info:
      path: CrashSafe/Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: "CrashSafe uses your location to show road conditions, find help nearby, and tell responders where you are."
        NSLocationAlwaysAndWhenInUseUsageDescription: "During trips, CrashSafe keeps watching your drive in the background so it can coach you and check on you after a crash."
        NSMotionUsageDescription: "CrashSafe uses motion data to notice hard braking and possible crashes."
        UIBackgroundModes: [location, audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cac.crashsafe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CrashSafe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # CarPlay entitlement only on simulator builds: device builds need Apple's approval first.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": CrashSafe/CrashSafe-CarPlay.entitlements
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"CrashSafe/Preview Content\""
        ENABLE_PREVIEWS: YES
    # dependencies:
    #   - package: Firebase
    #     product: FirebaseAuth
    #   - package: Firebase
    #     product: FirebaseCore

  CrashSafeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CrashSafeTests]
    dependencies:
      - target: CrashSafe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.cac.crashsafe.tests

schemes:
  CrashSafe:
    build:
      targets:
        CrashSafe: all
        CrashSafeTests: [test]
    test:
      targets: [CrashSafeTests]
